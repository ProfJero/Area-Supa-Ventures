<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<title>Report — Area Supa Ventures</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<link rel="stylesheet" href="assets/app.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="modulepreload" href="js/lib/firebase.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />

<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { user-select: none; background: #F8F6F2; }
  input, button, a { user-select: auto; }
  ::-webkit-scrollbar { display: none; } * { -ms-overflow-style: none; scrollbar-width: none; }
  .skeleton {
    background: linear-gradient(90deg,#e7e5e4 0%,#f5f4f2 50%,#e7e5e4 100%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
  }
  .skeleton-dark {
    background: linear-gradient(90deg,#2b2a27 0%,#3a3833 50%,#2b2a27 100%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .fade-up { animation: fadeUp 400ms ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .period-pill { transition: all 150ms ease; white-space: nowrap; }

  @media print {
    @page { size: A4; margin: 14mm; }
    .no-print { display: none !important; }
    .print-only { display: block !important; }
    main { max-width: 100% !important; padding: 0 !important; }
    .print-card { border: 1px solid #ddd !important; box-shadow: none !important; }
    * { color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #balanceChartContainer svg { max-width: 100%; }
  }
  .print-only { display: none; }
</style>
</head>

<body class="font-sans text-stone-900 antialiased min-h-screen">

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200 no-print">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <a href="reports.html" aria-label="Back"
         class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center shrink-0">
        <i class="fa-solid fa-arrow-left text-[14px]"></i>
      </a>
      <div class="min-w-0">
        <h1 id="pageTitle" class="text-[15px] font-bold text-stone-900 truncate">Report</h1>
        <p id="pageSubtitle" class="text-[11px] text-stone-500 truncate">Loading…</p>
      </div>
    </div>
    <div class="flex items-center gap-1">
      <button id="printBtn" type="button" aria-label="Print / PDF"
              class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center">
        <i class="fa-solid fa-file-pdf text-[14px]"></i>
      </button>
      <button id="refreshBtn" type="button" aria-label="Refresh"
              class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center">
        <i class="fa-solid fa-rotate-right text-[14px]"></i>
      </button>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 pt-6 pb-24">

  <!-- Print header -->
  <div class="print-only" style="margin-bottom: 8mm;">
    <div style="display:flex; align-items:center; justify-content:space-between; border-bottom: 2px solid #C59A3F; padding-bottom: 10px;">
      <div>
        <h1 style="margin:0; font-size: 20px; font-weight: 800;">Area Supa Ventures</h1>
        <p id="printTitle" style="margin: 2px 0 0; font-size: 12px; color: #444;">Business Report</p>
      </div>
      <div style="text-align: right; font-size: 11px;">
        <div><strong id="printPeriod">—</strong></div>
        <div style="margin-top: 2px;">Generated: <span id="printGeneratedAt">—</span></div>
        <div style="margin-top: 2px;">By: <span id="printGeneratedBy">—</span></div>
      </div>
    </div>
  </div>

  <!-- Error banner -->
  <div id="loadError" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3 no-print">
    <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-red-800">Couldn’t load report</p>
      <p id="loadErrorMsg" class="text-[12px] text-red-700 mt-0.5">Check your connection and retry.</p>
      <button id="retryBtn" type="button"
              class="mt-2 inline-flex items-center gap-1.5 text-[12px] font-semibold text-red-800 hover:text-red-900 underline underline-offset-2">
        <i class="fa-solid fa-rotate-right text-[11px]"></i> Retry
      </button>
    </div>
  </div>

  <!-- Period selector -->
  <section class="mb-5 fade-up no-print">
    <h2 class="text-[11px] font-semibold uppercase tracking-[0.14em] text-brand-gold mb-2 ml-1 flex items-center gap-2">
      <i class="fa-regular fa-calendar text-[10px]"></i>
      <span>Period</span>
    </h2>
    <div class="flex flex-wrap items-center gap-2">
      <button data-period="day"     class="period-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">Today</button>
      <button data-period="week"    class="period-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">This week</button>
      <button data-period="month"   class="period-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">This month</button>
      <button data-period="last3"   class="period-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">Last 3 months</button>
      <button data-period="custom"  class="period-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">
        <i class="fa-solid fa-sliders text-[10px] mr-1"></i> Custom
      </button>
    </div>

    <div id="customRange" class="hidden mt-3 rounded-xl bg-white border border-stone-200 p-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="fromInput" class="block text-[11px] font-medium text-stone-600 mb-1">From</label>
          <input id="fromInput" type="date"
                 class="w-full px-3 py-2 bg-[#FCFCF9] border border-stone-200 rounded-lg text-[13px] outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold" />
        </div>
        <div>
          <label for="toInput" class="block text-[11px] font-medium text-stone-600 mb-1">To</label>
          <input id="toInput" type="date"
                 class="w-full px-3 py-2 bg-[#FCFCF9] border border-stone-200 rounded-lg text-[13px] outline-none focus:border-brand-gold focus:ring-1 focus:ring-brand-gold" />
        </div>
      </div>
      <button id="applyCustom" type="button"
              class="mt-3 w-full py-2.5 bg-[#212121] hover:bg-black text-white text-[12.5px] font-semibold rounded-lg">
        Apply range
      </button>
    </div>

    <p id="activeRange" class="text-[11.5px] text-stone-500 mt-2 ml-1">
      <i class="fa-regular fa-clock mr-1"></i> <span class="skeleton inline-block w-40 h-3 align-middle"></span>
    </p>
  </section>

  <!-- Report content -->
  <div id="reportContent">
    <div class="rounded-2xl bg-white border border-stone-200 p-5 print-card fade-up">
      <div class="space-y-3">
        <div class="skeleton h-6 w-1/3"></div>
        <div class="skeleton h-4 w-full"></div>
        <div class="skeleton h-4 w-5/6"></div>
        <div class="skeleton h-4 w-4/6"></div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <section class="grid grid-cols-2 gap-3 mt-6 fade-up no-print">
    <button id="exportCsvBtn" type="button"
            class="flex items-center justify-center gap-2 py-3.5 bg-white border border-stone-300 hover:bg-stone-50 text-stone-900 text-[13px] font-semibold rounded-xl shadow-sm transition-all">
      <i class="fa-solid fa-file-csv text-brand-gold"></i> Export CSV
    </button>
    <button id="shareBtn" type="button"
            class="flex items-center justify-center gap-2 py-3.5 bg-[#212121] hover:bg-black text-white text-[13px] font-semibold rounded-xl shadow transition-all">
      <i class="fa-solid fa-share-nodes"></i> Share
    </button>
  </section>
</main>

<script type="module" src="js/report-view.js"></script>

</body>
</html>
