<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<title>Register Customer — Area Supa Ventures</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<link rel="stylesheet" href="assets/app.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="modulepreload" href="js/lib/firebase.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />

<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { user-select: none; background: #F8F6F2; }
  input, textarea, button, a { user-select: auto; }

  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  .fade-up { animation: fadeUp 400ms ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #57534e;
    margin-bottom: 6px;
  }
  .field-input {
    width: 100%;
    padding: 12px 14px;
    background: #FCFCF9;
    border: 1px solid #E5E1D8;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    color: #1c1917;
    outline: none;
    transition: border-color 150ms, box-shadow 150ms;
  }
  .field-input:focus {
    border-color: #C59A3F;
    box-shadow: 0 0 0 1px #C59A3F;
  }
  .field-input:disabled {
    background: #F5F3EF;
    color: #a8a29e;
  }
  .field-hint {
    font-size: 11px;
    color: #a8a29e;
    margin-top: 5px;
  }
  .field-error {
    font-size: 11px;
    color: #b91c1c;
    margin-top: 5px;
    display: none;
  }
  .field-error.show { display: block; }
</style>
</head>

<body class="font-sans text-stone-900 antialiased min-h-screen">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <a href="customers.html" aria-label="Cancel"
         class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center shrink-0">
        <i class="fa-solid fa-xmark text-[16px]"></i>
      </a>
      <div class="min-w-0">
        <h1 class="text-[15px] font-bold text-stone-900 truncate">Register customer</h1>
        <p class="text-[11px] text-stone-500 truncate">Bio data, contact, branch and next of kin</p>
      </div>
    </div>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 pt-6 pb-32">

  <div id="errorBox" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3" role="alert">
    <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p id="errorMsg" class="text-sm font-semibold text-red-800">Something went wrong.</p>
      <a id="dupLink" href="#" class="hidden mt-1 text-[12px] font-semibold text-red-800 underline">Open existing customer</a>
      <button id="dupContinue" type="button" class="hidden mt-1 ml-3 text-[12px] font-semibold text-red-800 underline">It’s a different person — register anyway</button>
    </div>
  </div>

  <form id="customerForm" class="space-y-5 fade-up" novalidate>
    <!-- Account number preview -->
    <div class="rounded-2xl bg-[#20201E] text-white p-5 relative overflow-hidden">
      <div class="absolute -right-6 -top-6 w-28 h-28 bg-[#C59A3F]/10 rounded-full blur-2xl pointer-events-none"></div>
      <div class="relative">
        <div class="flex items-center gap-2 text-stone-400 text-[11px] font-medium uppercase tracking-wider">
          <i class="fa-solid fa-hashtag text-[10px]"></i> Customer ID
        </div>
        <p class="mt-1.5 text-2xl font-bold font-mono tracking-tight text-brand-gold">ASV-1XXXX</p>
        <p class="mt-1 text-[11px] text-stone-400">The next customer ID (ASV-10001, ASV-10002, …) is assigned when you save.</p>
      </div>
    </div>

    <div id="formFields"></div>

    <label id="welcomeRow" class="hidden flex items-center gap-2 text-[12.5px] text-stone-700 px-1">
      <input id="sendWelcome" type="checkbox" checked class="w-4 h-4 rounded border-stone-300 text-brand-charcoal focus:ring-0" />
      Send welcome SMS with their customer ID
    </label>

    <button id="submitBtn" type="submit"
            class="w-full py-3.5 bg-[#212121] hover:bg-black active:scale-[0.99] disabled:opacity-70 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-xl shadow transition-all flex items-center justify-center gap-2">
      <i class="fa-solid fa-user-plus text-[12px]"></i> <span>Save Customer</span>
    </button>
  </form>
</main>

<script type="module" src="js/register-customer.js"></script>
</body>
</html>
