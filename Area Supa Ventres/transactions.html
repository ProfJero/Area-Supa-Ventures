<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<title>Transactions — Area Supa Ventures</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<script>
tailwind.config = {
  theme: { extend: {
    colors: { 'brand-gold':'#C59A3F','brand-gold-dark':'#B08632','brand-charcoal':'#212121','brand-bg':'#F8F6F2' },
    fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','Helvetica','Arial','sans-serif'] }
  }}
};
</script>
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { user-select: none; background: #F8F6F2; }
  input, button, a { user-select: auto; }
  ::-webkit-scrollbar { display:none; } * { -ms-overflow-style:none; scrollbar-width:none; }
  .skeleton { background: linear-gradient(90deg,#e7e5e4 0%,#f5f4f2 50%,#e7e5e4 100%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:6px; }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .fade-up { animation: fadeUp 400ms ease both; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:translateY(0);} }
</style>
</head>
<body class="font-sans text-stone-900 antialiased min-h-screen">

<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-4 pb-3">
    <div class="flex items-center gap-3 mb-3">
      <a href="dashboard.html" aria-label="Back"
         class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center shrink-0">
        <i class="fa-solid fa-arrow-left text-[14px]"></i>
      </a>
      <div class="min-w-0">
        <h1 class="text-[15px] font-bold text-stone-900 truncate">Transactions</h1>
        <p id="subHeader" class="text-[11px] text-stone-500 truncate">All transactions</p>
      </div>
    </div>
    <nav aria-label="Filters" class="flex items-center gap-2 overflow-x-auto">
      <button data-filter="all" class="filter-pill shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-semibold bg-[#212121] text-white">All</button>
      <button data-filter="deposit" class="filter-pill shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-medium bg-white border border-stone-200 text-stone-600 hover:text-stone-900">Deposits</button>
      <button data-filter="withdrawal" class="filter-pill shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-medium bg-white border border-stone-200 text-stone-600 hover:text-stone-900">Withdrawals</button>
    </nav>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 sm:px-6 pt-6 pb-24">

  <div id="loadError" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3">
    <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-red-800">Couldn’t load transactions</p>
      <p id="loadErrorMsg" class="text-[12px] text-red-700 mt-0.5">Check your connection and retry.</p>
      <button id="retryBtn" type="button"
              class="mt-2 inline-flex items-center gap-1.5 text-[12px] font-semibold text-red-800 hover:text-red-900 underline underline-offset-2">
        <i class="fa-solid fa-rotate-right text-[11px]"></i> Retry
      </button>
    </div>
  </div>

  <section class="grid grid-cols-2 gap-3 mb-5 fade-up">
    <div class="bg-white rounded-2xl border border-stone-200 p-4">
      <p class="text-[10.5px] font-semibold uppercase tracking-[0.14em] text-emerald-600 flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-down-to-line text-[9px]"></i> Deposits
      </p>
      <p id="sumDeposits" class="text-lg font-bold text-stone-900 mt-1.5">
        <span class="skeleton inline-block w-24 h-5 align-middle"></span>
      </p>
    </div>
    <div class="bg-white rounded-2xl border border-stone-200 p-4">
      <p class="text-[10.5px] font-semibold uppercase tracking-[0.14em] text-red-600 flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-up-from-bracket text-[9px]"></i> Withdrawals
      </p>
      <p id="sumWithdrawals" class="text-lg font-bold text-stone-900 mt-1.5">
        <span class="skeleton inline-block w-24 h-5 align-middle"></span>
      </p>
    </div>
  </section>

  <section>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-bold text-stone-900 tracking-tight">History</h2>
      <span id="txCount" class="text-[11px] text-stone-400"></span>
    </div>
    <div id="txList" class="bg-white rounded-2xl border border-stone-200 divide-y divide-stone-100 overflow-hidden">
      <div class="p-4 flex items-center justify-between">
        <div class="space-y-2 flex-1">
          <div class="skeleton h-3.5 w-32"></div>
          <div class="skeleton h-2.5 w-20"></div>
        </div>
        <div class="skeleton h-3.5 w-24"></div>
      </div>
      <div class="p-4 flex items-center justify-between">
        <div class="space-y-2 flex-1">
          <div class="skeleton h-3.5 w-28"></div>
          <div class="skeleton h-2.5 w-24"></div>
        </div>
        <div class="skeleton h-3.5 w-20"></div>
      </div>
    </div>
    <button id="loadMoreBtn"
            class="hidden mt-4 w-full py-3 bg-white border border-stone-200 hover:bg-stone-50 text-stone-700 text-[12.5px] font-semibold rounded-xl">
      Load more
    </button>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, getFirestore,
  collection, query, where, orderBy, limit, getDocs, startAfter, getDoc, doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { mountBottomNav } from './components/bottom-nav.js';
mountBottomNav('transactions');

const app = initializeApp({
  apiKey: "AIzaSyACzsITf1wON6R4vmJQR8cpA6qF7PDw2pY",
  authDomain: "area-supa-ventures.firebaseapp.com",
  projectId: "area-supa-ventures",
  storageBucket: "area-supa-ventures.firebasestorage.app",
  messagingSenderId: "339989502774",
  appId: "1:339989502774:web:6cbf99587d4317af0a7197"
});
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch { db = getFirestore(app); }

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const customerIdFilter = params.get('customerId');

const subHeader = $('subHeader');
const loadError = $('loadError'), loadErrorMsg = $('loadErrorMsg'), retryBtn = $('retryBtn');
const sumDeposits = $('sumDeposits'), sumWithdrawals = $('sumWithdrawals');
const txList = $('txList'), txCount = $('txCount'), loadMoreBtn = $('loadMoreBtn');
const filterButtons = document.querySelectorAll('.filter-pill');

const PAGE_SIZE = 20;

let currentFilter = 'all';
let lastDoc = null;
let loadedItems = [];
let customerName = null;

function formatGHS(n){ const v=Number(n)||0; return v.toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tsToDate(v){if(!v)return null;if(v.toDate)return v.toDate();if(v instanceof Date)return v;return new Date(v);}

function showError(msg){ loadErrorMsg.textContent = msg || 'Check your connection and retry.'; loadError.classList.remove('hidden'); }
function hideError(){ loadError.classList.add('hidden'); }

async function loadHeaderContext() {
  if (customerIdFilter) {
    try {
      const s = await getDoc(doc(db, 'customers', customerIdFilter));
      if (s.exists()) {
        const c = s.data();
        customerName = c.fullName || 'Customer';
        subHeader.innerHTML = `${escapeHtml(customerName)} <span class="text-stone-300">•</span> <span class="font-mono">${escapeHtml(c.accountNumber || '')}</span>`;
      } else {
        subHeader.textContent = 'All transactions';
      }
    } catch { subHeader.textContent = 'All transactions'; }
  } else {
    subHeader.textContent = 'All transactions';
  }
}

function buildQuery(afterDoc) {
  const clauses = [];
  if (customerIdFilter) clauses.push(where('customerId', '==', customerIdFilter));
  if (currentFilter !== 'all') clauses.push(where('type', '==', currentFilter));
  clauses.push(orderBy('createdAt', 'desc'));
  clauses.push(limit(PAGE_SIZE));
  if (afterDoc) clauses.push(startAfter(afterDoc));
  return query(collection(db, 'transactions'), ...clauses);
}

function renderItem(t) {
  const isDep = t.type === 'deposit';
  const sign = isDep ? '+' : '−';
  const color = isDep ? 'text-[#1B7F4B]' : 'text-[#B93838]';
  const bgIcon = isDep ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600';
  const icon = isDep ? 'fa-arrow-down-to-line' : 'fa-arrow-up-from-bracket';
  const label = isDep ? 'Deposit' : 'Withdrawal';
  const when = tsToDate(t.createdAt);
  const whenStr = when ? when.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' · ' + when.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  const nameLine = customerIdFilter ? '' :
    `<p class="text-[12px] font-semibold text-stone-700 truncate">${escapeHtml(t.customerName || t.accountNumber || '—')}</p>`;

  return `
    <div class="p-4 flex items-start gap-3">
      <div class="w-9 h-9 rounded-full ${bgIcon} flex items-center justify-center shrink-0">
        <i class="fa-solid ${icon} text-[12px]"></i>
      </div>
      <div class="min-w-0 flex-1">
        ${nameLine}
        <p class="text-[12.5px] font-bold text-stone-900">${label}</p>
        <p class="text-[11px] text-stone-400 truncate">${whenStr}</p>
        ${t.reference ? `<p class="text-[10.5px] font-mono text-stone-400 mt-0.5">${escapeHtml(t.reference)}</p>` : ''}
      </div>
      <div class="text-right shrink-0">
        <p class="text-[13px] font-bold ${color} whitespace-nowrap">${sign}GH₵${formatGHS(t.amount)}</p>
        <p class="text-[10.5px] text-stone-400 mt-0.5">Bal. GH₵${formatGHS(t.balanceAfter)}</p>
      </div>
    </div>`;
}

function computeSummaries(items) {
  let dep = 0, wd = 0;
  for (const t of items) {
    if (t.type === 'deposit') dep += Number(t.amount) || 0;
    if (t.type === 'withdrawal') wd += Number(t.amount) || 0;
  }
  sumDeposits.textContent = `GH₵${formatGHS(dep)}`;
  sumWithdrawals.textContent = `GH₵${formatGHS(wd)}`;
}

function renderList(items) {
  if (!items.length) {
    txList.innerHTML = `
      <div class="p-10 text-center">
        <i class="fa-solid fa-receipt text-3xl text-stone-300"></i>
        <p class="mt-3 text-sm font-semibold text-stone-700">No transactions found</p>
        <p class="text-xs text-stone-500 mt-1">${currentFilter === 'all' ? 'Transactions will appear here once recorded.' : 'Try a different filter.'}</p>
      </div>`;
    txCount.textContent = '';
    return;
  }
  txList.innerHTML = items.map(renderItem).join('');
  txCount.textContent = `${items.length} loaded`;
}

async function loadPage(reset = true) {
  if (reset) { lastDoc = null; loadedItems = []; }
  hideError();
  if (reset) {
    txList.innerHTML = `
      <div class="p-4 flex items-center justify-between">
        <div class="space-y-2 flex-1">
          <div class="skeleton h-3.5 w-32"></div>
          <div class="skeleton h-2.5 w-20"></div>
        </div>
        <div class="skeleton h-3.5 w-24"></div>
      </div>`;
    sumDeposits.innerHTML = '<span class="skeleton inline-block w-24 h-5 align-middle"></span>';
    sumWithdrawals.innerHTML = '<span class="skeleton inline-block w-24 h-5 align-middle"></span>';
  }

  try {
    const q = buildQuery(lastDoc);
    const snap = await getDocs(q);
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    lastDoc = snap.docs[snap.docs.length - 1] || lastDoc;

    loadedItems = reset ? items : loadedItems.concat(items);
    renderList(loadedItems);
    computeSummaries(loadedItems);

    loadMoreBtn.classList.toggle('hidden', snap.docs.length < PAGE_SIZE);
  } catch (e) {
    console.error('Tx load failed:', e);
    if (String(e?.message || '').toLowerCase().includes('index')) {
      showError('A Firestore index is being built. This takes about 1 minute — retry shortly.');
    } else {
      showError('Could not load transactions. Check your connection and retry.');
    }
    renderList([]);
  }
}

filterButtons.forEach((btn) => {
  btn.addEventListener('click', () => {
    filterButtons.forEach((b) => {
      b.className = b === btn
        ? 'filter-pill shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-semibold bg-[#212121] text-white'
        : 'filter-pill shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-medium bg-white border border-stone-200 text-stone-600 hover:text-stone-900';
    });
    currentFilter = btn.getAttribute('data-filter');
    loadPage(true);
  });
});

loadMoreBtn.addEventListener('click', () => loadPage(false));
retryBtn.addEventListener('click', () => loadPage(true));

onAuthStateChanged(auth, async (u) => {
  if (!u) { window.location.replace('index.html'); return; }
  await loadHeaderContext();
  loadPage(true);
});
</script>
</body>
</html>
