<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<title>Transactions — Area Supa Ventures</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="assets/app.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="modulepreload" href="js/lib/firebase.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />
<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { user-select: none; background: #F8F6F2; }
  input, button, a { user-select: auto; }
  ::-webkit-scrollbar { display:none; } * { -ms-overflow-style:none; scrollbar-width:none; }
  .skeleton { background: linear-gradient(90deg,#e7e5e4 0%,#f5f4f2 50%,#e7e5e4 100%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:6px; }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .fade-up { animation: fadeUp 400ms ease both; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:translateY(0);} }
</style>
</head>
<body class="font-sans text-stone-900 antialiased min-h-screen">

<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-4 pb-3">
    <div class="flex items-center gap-3 mb-3">
      <a href="dashboard.html" aria-label="Back"
         class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center shrink-0">
        <i class="fa-solid fa-arrow-left text-[14px]"></i>
      </a>
      <div class="min-w-0">
        <h1 class="text-[15px] font-bold text-stone-900 truncate">Transactions</h1>
        <p id="subHeader" class="text-[11px] text-stone-500 truncate">All transactions</p>
      </div>
    </div>
    <nav aria-label="Filters" class="flex items-center gap-2 overflow-x-auto">
      <button data-filter="all" class="filter-pill shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-semibold bg-[#212121] text-white">All</button>
      <button data-filter="deposit" class="filter-pill shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-medium bg-white border border-stone-200 text-stone-600 hover:text-stone-900">Deposits</button>
      <button data-filter="withdrawal" class="filter-pill shrink-0 px-3.5 py-1.5 rounded-full text-[12px] font-medium bg-white border border-stone-200 text-stone-600 hover:text-stone-900">Withdrawals</button>
    </nav>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 sm:px-6 pt-6 pb-24">

  <div id="loadError" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3">
    <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-red-800">Couldn’t load transactions</p>
      <p id="loadErrorMsg" class="text-[12px] text-red-700 mt-0.5">Check your connection and retry.</p>
      <button id="retryBtn" type="button"
              class="mt-2 inline-flex items-center gap-1.5 text-[12px] font-semibold text-red-800 hover:text-red-900 underline underline-offset-2">
        <i class="fa-solid fa-rotate-right text-[11px]"></i> Retry
      </button>
    </div>
  </div>

  <section class="grid grid-cols-2 gap-3 mb-5 fade-up">
    <div class="bg-white rounded-2xl border border-stone-200 p-4">
      <p class="text-[10.5px] font-semibold uppercase tracking-[0.14em] text-emerald-600 flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-down-to-line text-[9px]"></i> Deposits
      </p>
      <p id="sumDeposits" class="text-lg font-bold text-stone-900 mt-1.5">
        <span class="skeleton inline-block w-24 h-5 align-middle"></span>
      </p>
    </div>
    <div class="bg-white rounded-2xl border border-stone-200 p-4">
      <p class="text-[10.5px] font-semibold uppercase tracking-[0.14em] text-red-600 flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-up-from-bracket text-[9px]"></i> Withdrawals
      </p>
      <p id="sumWithdrawals" class="text-lg font-bold text-stone-900 mt-1.5">
        <span class="skeleton inline-block w-24 h-5 align-middle"></span>
      </p>
    </div>
  </section>

  <section>
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-bold text-stone-900 tracking-tight">History</h2>
      <span id="txCount" class="text-[11px] text-stone-400"></span>
    </div>
    <div id="txList" class="bg-white rounded-2xl border border-stone-200 divide-y divide-stone-100 overflow-hidden">
      <div class="p-4 flex items-center justify-between">
        <div class="space-y-2 flex-1">
          <div class="skeleton h-3.5 w-32"></div>
          <div class="skeleton h-2.5 w-20"></div>
        </div>
        <div class="skeleton h-3.5 w-24"></div>
      </div>
      <div class="p-4 flex items-center justify-between">
        <div class="space-y-2 flex-1">
          <div class="skeleton h-3.5 w-28"></div>
          <div class="skeleton h-2.5 w-24"></div>
        </div>
        <div class="skeleton h-3.5 w-20"></div>
      </div>
    </div>
    <button id="loadMoreBtn"
            class="hidden mt-4 w-full py-3 bg-white border border-stone-200 hover:bg-stone-50 text-stone-700 text-[12.5px] font-semibold rounded-xl">
      Load more
    </button>
  </section>
</main>

<script type="module" src="js/transactions.js"></script>
</body>
</html>
