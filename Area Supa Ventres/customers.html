<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<title>Customers — Area Supa Ventures</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<link rel="stylesheet" href="assets/app.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="modulepreload" href="js/lib/firebase.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />

<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { user-select: none; background: #F8F6F2; }
  input, button, a { user-select: auto; }

  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  .skeleton {
    background: linear-gradient(90deg, #e7e5e4 0%, #f5f4f2 50%, #e7e5e4 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .fade-up { animation: fadeUp 400ms ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body class="font-sans text-stone-900 antialiased min-h-screen">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">

    <div class="flex items-center gap-3 min-w-0">
      <a href="dashboard.html" aria-label="Back to dashboard"
         class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center shrink-0">
        <i class="fa-solid fa-arrow-left text-[14px]"></i>
      </a>
      <div class="min-w-0">
        <h1 class="text-[15px] font-bold text-stone-900 truncate">Customers</h1>
        <p class="text-[11px] text-stone-500 truncate">Browse, sort, search and manage susu customers</p>
      </div>
    </div>

    <a href="register-customer.html" aria-label="Register new customer" data-perm="customers.create"
       class="inline-flex items-center gap-1.5 px-3 h-9 bg-[#212121] hover:bg-black text-white text-[12px] font-semibold rounded-lg shadow-sm transition-colors">
      <i class="fa-solid fa-user-plus text-[11px]"></i>
      <span class="hidden sm:inline">New</span>
    </a>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 pt-6 pb-24">

  <!-- Error banner -->
  <div id="loadError" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3">
    <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-red-800">Couldn’t load customers</p>
      <p id="loadErrorMsg" class="text-[12px] text-red-700 mt-0.5">Check your connection and retry.</p>
      <button id="retryBtn" type="button"
              class="mt-2 inline-flex items-center gap-1.5 text-[12px] font-semibold text-red-800 hover:text-red-900 underline underline-offset-2">
        <i class="fa-solid fa-rotate-right text-[11px]"></i> Retry
      </button>
    </div>
  </div>

  <!-- Pick mode banner (from dashboard Deposit / Withdraw) -->
  <div id="pickBanner" class="hidden mb-4 rounded-xl border border-brand-gold/40 bg-brand-gold/10 px-4 py-3 text-[12.5px] text-stone-800 flex items-center gap-2">
    <i class="fa-solid fa-hand-pointer text-brand-gold"></i>
    <span id="pickText">Choose a customer</span>
  </div>

  <!-- Search -->
  <section class="mb-4 fade-up">
    <div class="relative flex items-center">
      <span class="absolute left-3.5 text-stone-400 pointer-events-none">
        <i class="fa-solid fa-magnifying-glass text-[14px]"></i>
      </span>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search name, phone or ASV-10001"
             class="w-full pl-10 pr-10 py-3 bg-white border border-stone-200 rounded-xl text-[14px] font-medium text-stone-800 shadow-sm outline-none transition-colors focus:ring-1 focus:ring-brand-gold focus:border-brand-gold" />
      <button id="clearSearch" type="button" aria-label="Clear"
              class="hidden absolute right-3 text-stone-400 hover:text-stone-700 transition-colors">
        <i class="fa-solid fa-circle-xmark text-[16px]"></i>
      </button>
    </div>
  </section>

  <!-- Sort & filter -->
  <section class="mb-4 flex flex-wrap items-center gap-2 fade-up">
    <label class="relative inline-flex items-center">
      <span class="sr-only">Sort customers</span>
      <i class="fa-solid fa-arrow-down-wide-short absolute left-3 text-stone-400 text-[12px] pointer-events-none"></i>
      <select id="sortSelect"
              class="pl-8 pr-8 py-2 bg-white border border-stone-200 rounded-lg text-[12.5px] font-semibold text-stone-700 shadow-sm focus:ring-1 focus:ring-brand-gold focus:border-brand-gold">
        <option value="name_asc">Name A → Z</option>
        <option value="name_desc">Name Z → A</option>
        <option value="acct_asc">Customer ID (lowest first)</option>
        <option value="acct_desc">Customer ID (highest first)</option>
        <option value="reg_desc">Registered (newest first)</option>
        <option value="reg_asc">Registered (oldest first)</option>
        <option value="bal_desc">Balance (highest first)</option>
        <option value="bal_asc">Balance (lowest first)</option>
      </select>
    </label>
    <label id="branchWrap" class="relative inline-flex items-center hidden">
      <span class="sr-only">Branch</span>
      <i class="fa-solid fa-code-branch absolute left-3 text-stone-400 text-[12px] pointer-events-none"></i>
      <select id="branchSelect"
              class="pl-8 pr-8 py-2 bg-white border border-stone-200 rounded-lg text-[12.5px] font-semibold text-stone-700 shadow-sm focus:ring-1 focus:ring-brand-gold focus:border-brand-gold">
        <option value="">All branches</option>
      </select>
    </label>
    <span id="resultsCount" class="ml-auto text-[11px] text-stone-400"></span>
  </section>

  <!-- Results -->
  <section id="resultsSection">
    <div id="resultsList" class="bg-white rounded-2xl border border-stone-200 divide-y divide-stone-100 overflow-hidden">
      <div class="p-4 flex items-center gap-3"><div class="skeleton w-10 h-10 rounded-full"></div><div class="space-y-2 flex-1"><div class="skeleton h-3.5 w-32"></div><div class="skeleton h-2.5 w-24"></div></div></div>
      <div class="p-4 flex items-center gap-3"><div class="skeleton w-10 h-10 rounded-full"></div><div class="space-y-2 flex-1"><div class="skeleton h-3.5 w-28"></div><div class="skeleton h-2.5 w-20"></div></div></div>
      <div class="p-4 flex items-center gap-3"><div class="skeleton w-10 h-10 rounded-full"></div><div class="space-y-2 flex-1"><div class="skeleton h-3.5 w-36"></div><div class="skeleton h-2.5 w-24"></div></div></div>
    </div>
    <div id="loadMoreWrap" class="hidden mt-4 text-center">
      <button id="loadMoreBtn" type="button" class="btn-light px-5 py-2.5 text-[12.5px]">Load more</button>
    </div>
    <div id="sentinel" class="h-4"></div>
  </section>
</main>

<!-- ================= SCRIPT ================= -->
<script type="module" src="js/customers.js"></script>

</body>
</html>
