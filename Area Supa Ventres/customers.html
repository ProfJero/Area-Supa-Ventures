<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<title>Customers — Area Supa Ventures</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        'brand-gold':      '#C59A3F',
        'brand-gold-dark': '#B08632',
        'brand-charcoal':  '#212121',
        'brand-bg':        '#F8F6F2',
      },
      fontFamily: {
        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
      },
    },
  },
};
</script>

<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { user-select: none; background: #F8F6F2; }
  input, button, a { user-select: auto; }

  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  .skeleton {
    background: linear-gradient(90deg, #e7e5e4 0%, #f5f4f2 50%, #e7e5e4 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: 6px;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .fade-up { animation: fadeUp 400ms ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body class="font-sans text-stone-900 antialiased min-h-screen">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">

    <div class="flex items-center gap-3 min-w-0">
      <a href="dashboard.html" aria-label="Back to dashboard"
         class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center shrink-0">
        <i class="fa-solid fa-arrow-left text-[14px]"></i>
      </a>
      <div class="min-w-0">
        <h1 class="text-[15px] font-bold text-stone-900 truncate">Customers</h1>
        <p class="text-[11px] text-stone-500 truncate">Search, register, and manage susu customers</p>
      </div>
    </div>

    <a href="register-customer.html" aria-label="Register new customer"
       class="inline-flex items-center gap-1.5 px-3 h-9 bg-[#212121] hover:bg-black text-white text-[12px] font-semibold rounded-lg shadow-sm transition-colors">
      <i class="fa-solid fa-user-plus text-[11px]"></i>
      <span class="hidden sm:inline">New</span>
    </a>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 pt-6 pb-24">

  <!-- Error banner -->
  <div id="loadError" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3">
    <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-red-800">Couldn’t search right now</p>
      <p id="loadErrorMsg" class="text-[12px] text-red-700 mt-0.5">Check your connection and retry.</p>
      <button id="retryBtn" type="button"
              class="mt-2 inline-flex items-center gap-1.5 text-[12px] font-semibold text-red-800 hover:text-red-900 underline underline-offset-2">
        <i class="fa-solid fa-rotate-right text-[11px]"></i> Retry
      </button>
    </div>
  </div>

  <!-- Search -->
  <section class="mb-5 fade-up">
    <label for="searchInput" class="block text-[11px] font-semibold uppercase tracking-[0.14em] text-brand-gold mb-2 flex items-center gap-2">
      <i class="fa-solid fa-magnifying-glass text-[10px]"></i>
      <span>Search</span>
    </label>
    <div class="relative flex items-center">
      <span class="absolute left-3.5 text-stone-400 pointer-events-none">
        <i class="fa-solid fa-magnifying-glass text-[14px]"></i>
      </span>
      <input id="searchInput" type="text" autocomplete="off" spellcheck="false"
             placeholder="Name, phone, or ASV-001234"
             class="w-full pl-10 pr-10 py-3 bg-white border border-stone-200 rounded-xl text-[14px] font-medium text-stone-800 shadow-sm outline-none transition-colors focus:ring-1 focus:ring-brand-gold focus:border-brand-gold" />
      <button id="clearSearch" type="button" aria-label="Clear"
              class="hidden absolute right-3 text-stone-400 hover:text-stone-700 transition-colors">
        <i class="fa-solid fa-circle-xmark text-[16px]"></i>
      </button>
    </div>
    <p class="text-[11px] text-stone-400 mt-2 ml-0.5">
      Searches by exact account number, phone, or name prefix.
    </p>
  </section>

  <!-- Results container -->
  <section id="resultsSection">
    <!-- Header row -->
    <div class="flex items-center justify-between mb-3">
      <h2 id="resultsTitle" class="text-sm font-bold text-stone-900 tracking-tight">Recent searches</h2>
      <span id="resultsCount" class="text-[11px] text-stone-400"></span>
    </div>

    <!-- Content area -->
    <div id="resultsList" class="bg-white rounded-2xl border border-stone-200 divide-y divide-stone-100 overflow-hidden">
      <!-- skeleton state -->
      <div class="p-4 flex items-center justify-between">
        <div class="space-y-2 flex-1">
          <div class="skeleton h-3.5 w-32"></div>
          <div class="skeleton h-2.5 w-24"></div>
        </div>
        <div class="skeleton h-3.5 w-20"></div>
      </div>
      <div class="p-4 flex items-center justify-between">
        <div class="space-y-2 flex-1">
          <div class="skeleton h-3.5 w-28"></div>
          <div class="skeleton h-2.5 w-20"></div>
        </div>
        <div class="skeleton h-3.5 w-24"></div>
      </div>
      <div class="p-4 flex items-center justify-between">
        <div class="space-y-2 flex-1">
          <div class="skeleton h-3.5 w-36"></div>
          <div class="skeleton h-2.5 w-24"></div>
        </div>
        <div class="skeleton h-3.5 w-20"></div>
      </div>
    </div>
  </section>
</main>

<!-- ================= SCRIPT ================= -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore,
  persistentLocalCache,
  persistentMultipleTabManager,
  getFirestore,
  collection,
  query,
  where,
  orderBy,
  limit,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { mountBottomNav } from './components/bottom-nav.js';
mountBottomNav('customers');

/* ---------- Firebase ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyACzsITf1wON6R4vmJQR8cpA6qF7PDw2pY",
  authDomain: "area-supa-ventures.firebaseapp.com",
  projectId: "area-supa-ventures",
  storageBucket: "area-supa-ventures.firebasestorage.app",
  messagingSenderId: "339989502774",
  appId: "1:339989502774:web:6cbf99587d4317af0a7197",
  measurementId: "G-WDJCSK78QE"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try {
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch (e) {
  console.warn('Persistent cache not available:', e);
  db = getFirestore(app);
}

/* ---------- Refs ---------- */
const $ = (id) => document.getElementById(id);
const searchInput   = $('searchInput');
const clearSearch   = $('clearSearch');
const resultsSection= $('resultsSection');
const resultsTitle  = $('resultsTitle');
const resultsCount  = $('resultsCount');
const resultsList   = $('resultsList');
const loadError     = $('loadError');
const loadErrorMsg  = $('loadErrorMsg');
const retryBtn      = $('retryBtn');

/* ---------- Helpers ---------- */
function formatGHS(n) {
  const v = Number(n) || 0;
  return v.toLocaleString('en-GH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function initialsFrom(name) {
  if (!name) return '??';
  const parts = String(name).trim().split(/\s+/);
  return ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase() || '??';
}
function normalizePhone(raw) {
  return String(raw || '').replace(/\D/g, '');
}

/* ---------- Recent searches (localStorage) ---------- */
const RECENT_KEY = 'asv.customers.recent.v1';
const RECENT_MAX = 8;

function readRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
  catch { return []; }
}
function pushRecent(customer) {
  const list = readRecent().filter((c) => c.id !== customer.id);
  list.unshift({
    id: customer.id,
    fullName: customer.fullName || '',
    accountNumber: customer.accountNumber || '',
    balance: Number(customer.balance) || 0,
    at: Date.now()
  });
  localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, RECENT_MAX)));
}
function clearRecent() {
  localStorage.removeItem(RECENT_KEY);
}

/* ---------- Error display ---------- */
function showError(msg) {
  loadErrorMsg.textContent = msg || 'Check your connection and retry.';
  loadError.classList.remove('hidden');
}
function hideError() { loadError.classList.add('hidden'); }

/* ---------- Rendering ---------- */
function renderCustomerList(items, { isRecent = false } = {}) {
  if (!items.length) {
    resultsList.innerHTML = isRecent
      ? `<div class="p-10 text-center">
           <i class="fa-solid fa-users text-3xl text-stone-300"></i>
           <p class="mt-3 text-sm font-semibold text-stone-700">No recent searches</p>
           <p class="text-xs text-stone-500 mt-1">Search for a customer to get started, or register a new one.</p>
           <a href="register-customer.html"
              class="mt-4 inline-flex items-center gap-1.5 px-4 py-2 bg-[#212121] hover:bg-black text-white text-[12px] font-semibold rounded-lg">
             <i class="fa-solid fa-user-plus text-[11px]"></i> Register Customer
           </a>
         </div>`
      : `<div class="p-10 text-center">
           <i class="fa-solid fa-magnifying-glass text-3xl text-stone-300"></i>
           <p class="mt-3 text-sm font-semibold text-stone-700">No matches found</p>
           <p class="text-xs text-stone-500 mt-1">Check the spelling, or try a different account number or phone.</p>
         </div>`;
    return;
  }

  resultsList.innerHTML = items.map((c) => {
    const balance = Number(c.balance) || 0;
    return `
      <a href="customer.html?id=${encodeURIComponent(c.id)}"
         data-id="${escapeHtml(c.id)}"
         class="customer-row block p-4 hover:bg-stone-50/70 transition-colors">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-brand-gold/15 text-brand-gold font-bold text-[12px] flex items-center justify-center shrink-0">
            ${escapeHtml(initialsFrom(c.fullName))}
          </div>
          <div class="min-w-0 flex-1">
            <p class="text-[13.5px] font-bold text-stone-900 truncate">${escapeHtml(c.fullName || 'Unnamed')}</p>
            <p class="text-[11px] font-mono text-stone-500 tracking-tight">
              ${escapeHtml(c.accountNumber || '—')}
            </p>
          </div>
          <div class="text-right shrink-0">
            <p class="text-[13px] font-bold text-[#1B7F4B]">GH₵${formatGHS(balance)}</p>
            <p class="text-[10.5px] text-stone-400 mt-0.5">Balance</p>
          </div>
          <i class="fa-solid fa-chevron-right text-stone-300 text-[12px] ml-1"></i>
        </div>
      </a>`;
  }).join('');

  // Remember clicked customers
  resultsList.querySelectorAll('a.customer-row').forEach((el) => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-id');
      const customer = items.find((c) => c.id === id);
      if (customer) pushRecent(customer);
    });
  });
}

/* ---------- Search ---------- */
let searchTimer = null;
let lastQuery = '';

async function searchCustomers(q) {
  const query_ = String(q || '').trim();
  if (!query_) return [];

  const upper = query_.toUpperCase();
  const lower = query_.toLowerCase();
  const digits = normalizePhone(query_);
  const looksLikeAccount = /^ASV-\d{1,6}$/i.test(query_);
  const looksLikePhone = digits.length >= 6;

  const promises = [];

  // 1. Exact account number
  if (looksLikeAccount) {
    promises.push(
      getDocs(query(collection(db, 'customers'),
        where('accountNumber', '==', upper), limit(5)))
    );
  }

  // 2. Phone exact match
  if (looksLikePhone) {
    promises.push(
      getDocs(query(collection(db, 'customers'),
        where('phoneNormalized', '==', digits), limit(5)))
    );
  }

  // 3. Name prefix
  if (!looksLikeAccount && !looksLikePhone) {
    promises.push(
      getDocs(query(collection(db, 'customers'),
        where('fullNameLower', '>=', lower),
        where('fullNameLower', '<=', lower + '\uf8ff'),
        orderBy('fullNameLower'),
        limit(15)))
    );
  }

  const snapshots = await Promise.all(promises);

  // Merge by document id (dedupe)
  const seen = new Map();
  for (const snap of snapshots) {
    for (const d of snap.docs) {
      if (!seen.has(d.id)) seen.set(d.id, { id: d.id, ...d.data() });
    }
  }

  return Array.from(seen.values());
}

async function runSearch() {
  const q = searchInput.value.trim();

  // Empty → show recent
  if (!q) {
    resultsTitle.textContent = 'Recent searches';
    resultsCount.textContent = '';
    renderCustomerList(readRecent(), { isRecent: true });
    clearSearch.classList.add('hidden');
    return;
  }

  clearSearch.classList.remove('hidden');
  resultsTitle.textContent = 'Results';
  resultsCount.textContent = '';

  // Skeleton while searching
  resultsList.innerHTML = `
    <div class="p-4 flex items-center justify-between">
      <div class="space-y-2 flex-1">
        <div class="skeleton h-3.5 w-32"></div>
        <div class="skeleton h-2.5 w-24"></div>
      </div>
      <div class="skeleton h-3.5 w-20"></div>
    </div>`;

  try {
    hideError();
    const results = await searchCustomers(q);
    resultsCount.textContent = `${results.length} result${results.length === 1 ? '' : 's'}`;
    renderCustomerList(results);
  } catch (err) {
    console.error('Search failed:', err);
    showError('Search failed. Check your connection and retry.');
    renderCustomerList([], { isRecent: false });
  }
}

/* ---------- Event wiring ---------- */
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 250);
});

clearSearch.addEventListener('click', () => {
  searchInput.value = '';
  runSearch();
  searchInput.focus();
});

retryBtn.addEventListener('click', () => {
  if (searchInput.value.trim()) runSearch();
});

/* Initial state */
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.replace('index.html');
    return;
  }
  // Render recent searches on load
  runSearch();
});
</script>

</body>
</html>
