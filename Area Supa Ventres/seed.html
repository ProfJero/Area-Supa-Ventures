<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Seed Admin — Area Supa Ventures</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center p-6 font-sans">

<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-7">
  <h1 class="text-xl font-bold text-stone-900 mb-1">Seed Admin Account</h1>
  <p class="text-sm text-stone-500 mb-6">
    Creates the owner account and Firestore profile. Delete this file after use.
  </p>

  <form id="seedForm" class="space-y-4">
    <div>
      <label class="block text-xs font-medium text-stone-600 mb-1">Full name</label>
      <input id="name" type="text" required
        class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm outline-none focus:ring-1 focus:ring-amber-500" />
    </div>
    <div>
      <label class="block text-xs font-medium text-stone-600 mb-1">Email</label>
      <input id="email" type="email" required
        class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm outline-none focus:ring-1 focus:ring-amber-500" />
    </div>
    <div>
      <label class="block text-xs font-medium text-stone-600 mb-1">Password (min 8 chars)</label>
      <input id="password" type="password" required minlength="8"
        class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm outline-none focus:ring-1 focus:ring-amber-500" />
    </div>
    <div>
      <label class="block text-xs font-medium text-stone-600 mb-1">
        Phone (optional, for OTP login) — e.g. +233245550192
      </label>
      <input id="phone" type="tel"
        class="w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm outline-none focus:ring-1 focus:ring-amber-500" />
    </div>
    <button id="btn" type="submit"
      class="w-full py-3 bg-stone-900 text-white rounded-xl text-sm font-semibold hover:bg-black disabled:opacity-60">
      Create Admin
    </button>
  </form>

  <pre id="out" class="mt-5 text-[12px] whitespace-pre-wrap text-stone-700"></pre>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app  = initializeApp({
  apiKey: "AIzaSyACzsITf1wON6R4vmJQR8cpA6qF7PDw2pY",
  authDomain: "area-supa-ventures.firebaseapp.com",
  projectId: "area-supa-ventures",
  storageBucket: "area-supa-ventures.firebasestorage.app",
  messagingSenderId: "339989502774",
  appId: "1:339989502774:web:6cbf99587d4317af0a7197"
});
const auth = getAuth(app);
const db   = getFirestore(app);

const out = document.getElementById('out');
const btn = document.getElementById('btn');

document.getElementById('seedForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  out.textContent = 'Creating…';

  const name  = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const pwd   = document.getElementById('password').value;
  const phone = document.getElementById('phone').value.trim();

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
    const uid  = cred.user.uid;

    await setDoc(doc(db, 'users', uid), {
      name,
      email,
      phone: phone || null,
      role: 'owner',
      status: 'active',
      createdAt: serverTimestamp()
    });

    await signOut(auth);

    out.textContent =
      `✅ Admin created.\n\nUID: ${uid}\nEmail: ${email}\n\n` +
      `Delete seed.html now, then sign in at index.html.`;
  } catch (err) {
    console.error(err);
    out.textContent = `❌ ${err.code || ''} — ${err.message}`;
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
