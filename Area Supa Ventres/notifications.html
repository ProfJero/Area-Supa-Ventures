<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<title>Notifications — Area Supa Ventures</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<script>
tailwind.config = { theme: { extend: {
  colors: {
    'brand-gold': '#C59A3F', 'brand-gold-dark': '#B08632',
    'brand-charcoal': '#212121', 'brand-bg': '#F8F6F2',
    'brand-success': '#1B7F4B', 'brand-danger': '#B93838',
  },
  fontFamily: { sans: ['-apple-system','BlinkMacSystemFont','Segoe UI','Roboto','Helvetica','Arial','sans-serif'] },
}}};
</script>

<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { user-select: none; background: #F8F6F2; }
  input, button, a { user-select: auto; }
  ::-webkit-scrollbar { display: none; } * { -ms-overflow-style: none; scrollbar-width: none; }

  .skeleton {
    background: linear-gradient(90deg,#e7e5e4 0%,#f5f4f2 50%,#e7e5e4 100%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  .fade-up { animation: fadeUp 400ms ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .filter-pill { transition: all 150ms ease; white-space: nowrap; }

  .notif-item { transition: background-color 150ms; }
  .notif-item:hover { background: #faf9f6; }

  .notif-item.entering { animation: notifEnter 400ms ease both; }
  @keyframes notifEnter {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .unread-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #C59A3F;
  }

  .delete-btn {
    opacity: 0; transition: opacity 150ms;
  }
  .notif-item:hover .delete-btn,
  .notif-item:focus-within .delete-btn { opacity: 1; }

  @media (hover: none) {
    /* On touch devices, always show the delete button */
    .delete-btn { opacity: 0.5; }
  }
</style>
</head>

<body class="font-sans text-stone-900 antialiased min-h-screen">

<!-- ============ HEADER ============ -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-2xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <a href="dashboard.html" aria-label="Back"
         class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center shrink-0">
        <i class="fa-solid fa-arrow-left text-[14px]"></i>
      </a>
      <div class="min-w-0">
        <h1 class="text-[15px] font-bold text-stone-900 truncate">Notifications</h1>
        <p id="subHeader" class="text-[11px] text-stone-500 truncate">Loading…</p>
      </div>
    </div>
    <div class="flex items-center gap-1">
      <button id="markAllBtn" type="button" aria-label="Mark all as read"
              class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed">
        <i class="fa-solid fa-check-double text-[14px]"></i>
      </button>
      <button id="refreshBtn" type="button" aria-label="Refresh"
              class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center">
        <i class="fa-solid fa-rotate-right text-[14px]"></i>
      </button>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="max-w-2xl mx-auto px-4 sm:px-6 pt-6 pb-24">

  <!-- Error banner -->
  <div id="loadError" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3">
    <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-red-800">Couldn’t load notifications</p>
      <p id="loadErrorMsg" class="text-[12px] text-red-700 mt-0.5">Check your connection and retry.</p>
      <button id="retryBtn" type="button"
              class="mt-2 inline-flex items-center gap-1.5 text-[12px] font-semibold text-red-800 hover:text-red-900 underline underline-offset-2">
        <i class="fa-solid fa-rotate-right text-[11px]"></i> Retry
      </button>
    </div>
  </div>

  <!-- Offline banner -->
  <div id="offlineBanner" class="hidden mb-5 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 flex items-start gap-3">
    <i class="fa-solid fa-cloud-arrow-up text-amber-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-[13px] font-semibold text-amber-800">You’re offline</p>
      <p class="text-[11.5px] text-amber-700 mt-0.5">
        Showing cached notifications. New activity will appear once you reconnect.
      </p>
    </div>
  </div>

  <!-- Filters -->
  <section class="mb-5 fade-up">
    <div class="flex flex-wrap items-center gap-2">
      <button data-filter="all"         class="filter-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">All</button>
      <button data-filter="unread"      class="filter-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">Unread</button>
      <button data-filter="deposit"     class="filter-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">Deposits</button>
      <button data-filter="withdrawal"  class="filter-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">Withdrawals</button>
      <button data-filter="system"      class="filter-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold">System</button>
    </div>
  </section>

  <!-- Feed -->
  <section id="feed">
    <!-- Skeleton rows -->
    <div class="space-y-3">
      <div class="rounded-2xl bg-white border border-stone-200 p-4 flex items-start gap-3">
        <div class="skeleton w-10 h-10 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-3.5 w-40"></div>
          <div class="skeleton h-3 w-56"></div>
        </div>
      </div>
      <div class="rounded-2xl bg-white border border-stone-200 p-4 flex items-start gap-3">
        <div class="skeleton w-10 h-10 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-3.5 w-32"></div>
          <div class="skeleton h-3 w-48"></div>
        </div>
      </div>
      <div class="rounded-2xl bg-white border border-stone-200 p-4 flex items-start gap-3">
        <div class="skeleton w-10 h-10 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-3.5 w-44"></div>
          <div class="skeleton h-3 w-40"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Empty state (hidden by default) -->
  <section id="emptyState" class="hidden">
    <div class="rounded-2xl bg-white border border-stone-200 p-10 text-center">
      <div class="w-16 h-16 rounded-full bg-brand-gold/15 mx-auto flex items-center justify-center">
        <i id="emptyIcon" class="fa-solid fa-bell text-2xl text-brand-gold"></i>
      </div>
      <p id="emptyTitle" class="mt-4 text-[15px] font-bold text-stone-900">You’re all caught up</p>
      <p id="emptyBody" class="mt-1.5 text-[12.5px] text-stone-500 leading-relaxed max-w-xs mx-auto">
        Notifications about deposits, withdrawals and sync status will appear here.
      </p>
      <button id="emptyClearFilter" type="button"
              class="hidden mt-5 inline-flex items-center gap-2 px-4 py-2.5 bg-[#212121] hover:bg-black text-white text-[12.5px] font-semibold rounded-xl">
        <i class="fa-solid fa-filter-circle-xmark text-[11px]"></i> Clear filter
      </button>
    </div>
  </section>

  <!-- Footer note -->
  <p id="lastUpdated" class="text-[10.5px] text-stone-400 text-center mt-6">
    <i class="fa-regular fa-clock mr-1"></i> Live
  </p>
</main>

<script type="module">
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { mountBottomNav } from './components/bottom-nav.js';
import {
  auth, db,
  subscribeUnreadCount, markAllAsRead, deleteNotification
} from './components/notifications.js';
import {
  collection, query, where, orderBy, limit, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

mountBottomNav('profile');

/* ---------- Refs ---------- */
const $ = (id) => document.getElementById(id);
const subHeader = $('subHeader');
const loadError = $('loadError'), loadErrorMsg = $('loadErrorMsg'), retryBtn = $('retryBtn');
const offlineBanner = $('offlineBanner');
const filterButtons = document.querySelectorAll('.filter-pill');
const feed = $('feed');
const emptyState = $('emptyState'), emptyIcon = $('emptyIcon');
const emptyTitle = $('emptyTitle'), emptyBody = $('emptyBody');
const emptyClearFilter = $('emptyClearFilter');
const markAllBtn = $('markAllBtn'), refreshBtn = $('refreshBtn');
const lastUpdatedEl = $('lastUpdated');

/* ---------- State ---------- */
let currentUser = null;
let allNotifs = [];
let currentFilter = 'all';
let unsub = null;
let unreadCount = 0;

/* ---------- Helpers ---------- */
function formatGHS(n) { const v = Number(n)||0; return v.toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function tsToDate(v){ if(!v) return null; if(v.toDate) return v.toDate(); if(v instanceof Date) return v; return new Date(v); }

function fmtRelative(d) {
  if (!d) return '';
  const diff = Date.now() - d.getTime();
  const sec = Math.floor(diff/1000);
  if (sec < 30) return 'Just now';
  if (sec < 60) return `${sec}s ago`;
  const min = Math.floor(sec/60);
  if (min < 60) return `${min} min${min===1?'':'s'} ago`;
  const hr = Math.floor(min/60);
  if (hr < 24) return `${hr} hr${hr===1?'':'s'} ago`;
  const day = Math.floor(hr/24);
  if (day < 7) return `${day} day${day===1?'':'s'} ago`;
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
function dayLabel(d) {
  if (!d) return 'Earlier';
  const today = startOfDay(new Date()).getTime();
  const yesterday = today - 86400000;
  const t = startOfDay(d).getTime();
  if (t === today) return 'Today';
  if (t === yesterday) return 'Yesterday';
  if (t > today - 7 * 86400000) return 'This week';
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
}

/* Type → visual mapping */
function typeMeta(t) {
  const map = {
    deposit:           { bg: 'bg-emerald-50',  fg: 'text-emerald-600', icon: 'fa-arrow-down-to-line' },
    withdrawal:        { bg: 'bg-red-50',      fg: 'text-red-600',     icon: 'fa-arrow-up-from-bracket' },
    withdrawal_failed: { bg: 'bg-red-50',      fg: 'text-red-600',     icon: 'fa-circle-exclamation' },
    sync_pending:      { bg: 'bg-amber-50',    fg: 'text-amber-600',   icon: 'fa-cloud-arrow-up' },
    sync_failed:       { bg: 'bg-red-50',      fg: 'text-red-600',     icon: 'fa-triangle-exclamation' },
    welcome:           { bg: 'bg-brand-gold/15', fg: 'text-brand-gold', icon: 'fa-user-plus' },
    system:            { bg: 'bg-blue-50',     fg: 'text-blue-600',    icon: 'fa-bullhorn' }
  };
  return map[t] || { bg: 'bg-stone-100', fg: 'text-stone-600', icon: 'fa-bell' };
}

/* ---------- Filtering ---------- */
function matchesFilter(n) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'unread') return !n.read;
  if (currentFilter === 'deposit') return n.type === 'deposit';
  if (currentFilter === 'withdrawal') return n.type === 'withdrawal' || n.type === 'withdrawal_failed';
  if (currentFilter === 'system') return n.type === 'system' || n.type === 'sync_pending' || n.type === 'sync_failed' || n.type === 'welcome';
  return true;
}

/* ---------- Rendering ---------- */
function render() {
  const items = allNotifs.filter(matchesFilter);

  if (!items.length) {
    feed.innerHTML = '';
    feed.classList.add('hidden');
    emptyState.classList.remove('hidden');

    if (allNotifs.length === 0) {
      emptyIcon.className = 'fa-solid fa-bell text-2xl text-brand-gold';
      emptyTitle.textContent = 'No notifications yet';
      emptyBody.textContent = 'Notifications about deposits, withdrawals and sync status will appear here.';
      emptyClearFilter.classList.add('hidden');
    } else {
      emptyIcon.className = 'fa-solid fa-filter-circle-xmark text-2xl text-brand-gold';
      emptyTitle.textContent = currentFilter === 'unread' ? 'You’re all caught up' : 'No notifications match this filter';
      emptyBody.textContent = currentFilter === 'unread'
        ? 'No unread notifications. Nice work!'
        : 'Try a different filter to see more.';
      emptyClearFilter.classList.toggle('hidden', currentFilter === 'all');
    }
    return;
  }

  feed.classList.remove('hidden');
  emptyState.classList.add('hidden');

  // Group by day
  const groups = new Map();
  for (const n of items) {
    const d = tsToDate(n.createdAt);
    const key = d ? dayLabel(d) : 'Earlier';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ ...n, _date: d });
  }

  feed.innerHTML = Array.from(groups.entries()).map(([label, list]) => `
    <div class="mb-4">
      <p class="text-[11px] font-semibold uppercase tracking-[0.14em] text-stone-400 mb-2 ml-1">${escapeHtml(label)}</p>
      <div class="rounded-2xl bg-white border border-stone-200 overflow-hidden">
        ${list.map(renderItem).join('')}
      </div>
    </div>
  `).join('');
}

function renderItem(n) {
  const meta = typeMeta(n.type);
  const isUnread = !n.read;
  const timeStr = n._date ? fmtRelative(n._date) : '';

  // Determine target URL
  let target = null;
  if (n.customerId) {
    target = `customer.html?id=${encodeURIComponent(n.customerId)}`;
  } else if (n.transactionId && !n.customerId) {
    target = `transactions.html`;
  }

  const row = `
    <div class="notif-item relative ${isUnread ? 'bg-brand-gold/[0.03]' : ''}"
         data-id="${escapeHtml(n.id)}"
         data-target="${target ? escapeHtml(target) : ''}">
      <div class="flex items-start gap-3 p-4 ${target ? 'cursor-pointer' : ''}" data-action="open">
        <div class="w-10 h-10 rounded-full ${meta.bg} ${meta.fg} flex items-center justify-center shrink-0 relative">
          <i class="fa-solid ${meta.icon} text-[15px]"></i>
          ${isUnread ? '<span class="unread-dot absolute -top-0.5 -right-0.5 ring-2 ring-white"></span>' : ''}
        </div>
        <div class="flex-1 min-w-0 pr-6">
          <div class="flex items-start justify-between gap-2">
            <p class="text-[13.5px] font-bold text-stone-900 leading-tight pr-2 ${isUnread ? '' : 'text-stone-700'}">
              ${escapeHtml(n.title)}
            </p>
            <span class="text-[10.5px] text-stone-400 whitespace-nowrap shrink-0">${timeStr}</span>
          </div>
          ${n.body ? `<p class="text-[12px] text-stone-500 mt-0.5 leading-relaxed">${escapeHtml(n.body)}</p>` : ''}
          ${n.amount ? `
            <p class="text-[12px] font-semibold mt-1 ${n.type === 'deposit' ? 'text-emerald-600' : 'text-red-600'}">
              ${n.type === 'deposit' ? '+' : '−'}GH₵${formatGHS(n.amount)}
            </p>` : ''}
        </div>
      </div>
      <button type="button" data-action="delete"
              aria-label="Delete notification"
              class="delete-btn absolute top-3 right-3 w-7 h-7 rounded-lg text-stone-400 hover:text-red-600 hover:bg-red-50 transition-colors flex items-center justify-center">
        <i class="fa-solid fa-xmark text-[13px]"></i>
      </button>
    </div>
  `;
  return row;
}

/* ---------- Interaction ---------- */
feed.addEventListener('click', async (e) => {
  const deleteBtn = e.target.closest('[data-action="delete"]');
  const openArea = e.target.closest('[data-action="open"]');
  const item = e.target.closest('.notif-item');
  if (!item) return;

  const id = item.getAttribute('data-id');
  const target = item.getAttribute('data-target');
  const notif = allNotifs.find(x => x.id === id);

  if (deleteBtn) {
    e.stopPropagation();
    item.style.transition = 'opacity 200ms, transform 200ms';
    item.style.opacity = '0';
    item.style.transform = 'translateX(-8px)';
    try {
      await deleteNotification(id);
      setTimeout(() => item.remove(), 200);
    } catch (err) {
      console.error('Delete failed:', err);
      item.style.opacity = '1';
      item.style.transform = 'none';
    }
    return;
  }

  if (openArea && notif) {
    // Mark as read (fire and forget — UI updates via subscription)
    if (!notif.read) {
      import('./components/notifications.js').then(({ markAsRead }) => markAsRead(id));
    }
    if (target) {
      window.location.href = target;
    }
  }
});

/* ---------- Filter buttons ---------- */
function setActiveFilter() {
  filterButtons.forEach(b => {
    const active = b.getAttribute('data-filter') === currentFilter;
    b.className = 'filter-pill shrink-0 px-3.5 py-2 rounded-full text-[12px] font-semibold ' + (
      active
        ? 'bg-[#212121] text-white shadow'
        : 'bg-white border border-stone-200 text-stone-600 hover:text-stone-900'
    );
  });
}

filterButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.getAttribute('data-filter');
    setActiveFilter();
    render();
  });
});

emptyClearFilter.addEventListener('click', () => {
  currentFilter = 'all';
  setActiveFilter();
  render();
});

/* ---------- Mark all as read ---------- */
markAllBtn.addEventListener('click', async () => {
  if (unreadCount === 0) return;
  markAllBtn.disabled = true;
  markAllBtn.querySelector('i').classList.add('fa-spin');
  try {
    const count = await markAllAsRead();
    if (count > 0) showToast(`${count} notification${count === 1 ? '' : 's'} marked as read`);
  } catch (e) {
    console.error('Mark all failed:', e);
    showToast('Could not mark all as read', 'error');
  } finally {
    markAllBtn.disabled = false;
    markAllBtn.querySelector('i').classList.remove('fa-spin');
  }
});

/* ---------- Toast ---------- */
function showToast(msg, tone = 'default') {
  const el = document.createElement('div');
  el.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-white text-[12.5px] font-medium shadow-lg fade-up ' +
    (tone === 'error' ? 'bg-[#B93838]' : 'bg-stone-900');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity 250ms';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 300);
  }, 2200);
}

/* ---------- Offline/online ---------- */
function updateOfflineBanner() {
  offlineBanner.classList.toggle('hidden', navigator.onLine);
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);

/* ---------- Live subscription ---------- */
function subscribeFeed(user) {
  if (unsub) { unsub(); unsub = null; }
  const q = query(
    collection(db, 'notifications'),
    where('userId', '==', user.uid),
    orderBy('createdAt', 'desc'),
    limit(100)
  );
  unsub = onSnapshot(q,
    (snap) => {
      allNotifs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      const now = new Date();
      lastUpdatedEl.innerHTML = `<i class="fa-regular fa-clock mr-1"></i> Live · ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
      render();
    },
    (err) => {
      console.error('Feed subscription error:', err);
      loadErrorMsg.textContent = err?.message?.toLowerCase().includes('permission')
        ? 'You don’t have permission to read notifications.'
        : 'Could not load notifications. Check your connection.';
      loadError.classList.remove('hidden');
    }
  );
}

/* ---------- Init ---------- */
onAuthStateChanged(auth, (u) => {
  if (!u) { window.location.replace('index.html'); return; }
  currentUser = u;
  setActiveFilter();
  updateOfflineBanner();
  subscribeFeed(u);

  // Unread count for header label
  subscribeUnreadCount((count) => {
    unreadCount = count;
    subHeader.textContent = count > 0
      ? `${count} unread`
      : 'All caught up';
    markAllBtn.disabled = count === 0;
  });
});
</script>

</body>
</html>
