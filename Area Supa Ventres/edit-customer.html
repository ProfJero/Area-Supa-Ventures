<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F8F6F2" />
<title>Edit Customer — Area Supa Ventures</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

<link rel="stylesheet" href="assets/app.css" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="modulepreload" href="js/lib/firebase.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" />
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" />

<style>
  html, body { -webkit-tap-highlight-color: transparent; }
  body { user-select: none; background: #F8F6F2; }
  input, textarea, button, a { user-select: auto; }
  ::-webkit-scrollbar { display: none; } * { -ms-overflow-style: none; scrollbar-width: none; }

  .skeleton {
    background: linear-gradient(90deg,#e7e5e4 0%,#f5f4f2 50%,#e7e5e4 100%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
  }
  .skeleton-dark {
    background: linear-gradient(90deg,#2b2a27 0%,#3a3833 50%,#2b2a27 100%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px;
  }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  .fade-up { animation: fadeUp 400ms ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: #57534e;
    margin-bottom: 6px;
  }
  .field-input {
    width: 100%;
    padding: 12px 14px;
    background: #FCFCF9;
    border: 1px solid #E5E1D8;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    color: #1c1917;
    outline: none;
    transition: border-color 150ms, box-shadow 150ms;
  }
  .field-input:focus {
    border-color: #C59A3F;
    box-shadow: 0 0 0 1px #C59A3F;
  }
  .field-input:disabled {
    background: #F5F3EF;
    color: #a8a29e;
    cursor: not-allowed;
  }
  .field-hint {
    font-size: 11px;
    color: #a8a29e;
    margin-top: 5px;
  }
  .field-error {
    font-size: 11px;
    color: #b91c1c;
    margin-top: 5px;
    display: none;
  }
  .field-error.show { display: block; }

  .status-pill {
    transition: all 150ms ease;
    cursor: pointer;
  }

  .toast {
    animation: toastIn 250ms cubic-bezier(0.32, 0.72, 0, 1) both;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 12px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }
</style>
</head>

<body class="font-sans text-stone-900 antialiased min-h-screen">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-stone-200">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <a id="backBtn" href="customers.html" aria-label="Cancel"
         class="w-9 h-9 rounded-lg text-stone-500 hover:text-stone-800 hover:bg-stone-100 transition-colors flex items-center justify-center shrink-0">
        <i class="fa-solid fa-xmark text-[16px]"></i>
      </a>
      <div class="min-w-0">
        <h1 class="text-[15px] font-bold text-stone-900 truncate">Edit customer</h1>
        <p id="headerSub" class="text-[11px] text-stone-500 truncate">Loading…</p>
      </div>
    </div>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="max-w-3xl mx-auto px-4 sm:px-6 pt-6 pb-32">

  <div id="loadError" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3">
    <i class="fa-solid fa-triangle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-red-800">Couldn’t load this customer</p>
      <p id="loadErrorMsg" class="text-[12px] text-red-700 mt-0.5">Check your connection and retry.</p>
    </div>
  </div>

  <div id="saveError" class="hidden mb-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 flex items-start gap-3" role="alert">
    <i class="fa-solid fa-circle-exclamation text-red-600 mt-0.5"></i>
    <div class="flex-1 min-w-0">
      <p class="text-sm font-semibold text-red-800">Couldn’t save changes</p>
      <p id="saveErrorMsg" class="text-[12px] text-red-700 mt-0.5">Please try again.</p>
    </div>
  </div>

  <section class="rounded-2xl bg-[#20201E] text-white p-5 mb-5 relative overflow-hidden fade-up">
    <div class="absolute -right-8 -top-8 w-32 h-32 bg-[#C59A3F]/10 rounded-full blur-2xl pointer-events-none"></div>
    <div class="relative">
      <p id="displayName" class="text-[15px] font-bold truncate"><span class="skeleton-dark inline-block w-40 h-4"></span></p>
      <p id="displayAccount" class="font-mono text-[12px] text-brand-gold mt-1"><span class="skeleton-dark inline-block w-20 h-3"></span></p>
    </div>
    <div class="relative mt-4 pt-4 border-t border-stone-700/60 flex items-center gap-2 text-[11px] text-stone-400">
      <i class="fa-solid fa-lock text-[10px]"></i>
      <span>Customer ID and balances cannot be edited. Money only changes through deposits and withdrawals.</span>
    </div>
  </section>

  <form id="editForm" class="space-y-5 fade-up hidden" novalidate>
    <div id="formFields"></div>
    <button id="saveBtn" type="submit"
            class="w-full py-3.5 bg-[#212121] hover:bg-black active:scale-[0.99] disabled:opacity-70 disabled:cursor-not-allowed text-white text-sm font-semibold rounded-xl shadow transition-all flex items-center justify-center gap-2">
      <i class="fa-solid fa-check text-[12px]"></i> <span>Save changes</span>
    </button>
  </form>
</main>

<script type="module" src="js/edit-customer.js"></script>
</body>
</html>
